global:
  security:
    allowInsecureImages: true

controller:
  image:
    registry: docker.io
    repository: bitnamilegacy/argo-workflow-controller
    tag: 3.7.1-debian-12-r1

server:
  image:
    registry: docker.io
    repository: bitnamilegacy/argo-workflow-cli
    tag: 3.7.1-debian-12-r1
  # SSO (Entra ID) for the UI, plus client mode so a bearer token
  # (kubectl create token l1-user ...) can still log in for testing.
  extraArgs:
    - --auth-mode=client
  auth:
    enabled: true
    mode: sso
    sso:
      enabled: true
      # Only used by the chart's argo-server ClusterRole: a truthy value grants
      # get/list/watch on serviceaccounts, which rbac-rule lookup needs.
      rbac:
        enabled: true
      config:
        issuer: https://login.microsoftonline.com/ea69751a-6de3-43d6-bb89-d5e5b8caad2d/v2.0
        clientId:
          name: argo-server-sso
          key: client-id
        clientSecret:
          name: argo-server-sso
          key: client-secret
        redirectUrl: http://localhost:2746/oauth2/callback
        scopes:
          - openid
          - profile
          - email
        # Bitnami chart v13.0.6's configmap template only renders
        # server.auth.sso.config into the workflow-controller-configmap's
        # `sso:` key -- it silently drops server.auth.sso.rbac, so the SSO
        # RBAC namespace delegation feature (workflows.argoproj.io/rbac-rule)
        # never activates and every SSO login falls back to the argo-server's
        # own (broad) ServiceAccount. Nesting rbac here rides the same
        # passthrough so it lands in the configmap's sso.rbac.enabled field.
        rbac:
          enabled: true
        # Trim the groups claim to the three runbook groups; must match the
        # GUIDs in the rbac-rule annotations in manifests/rbac/humans.yaml.
        filterGroupsRegex:
          - "d16dd38c-b215-4e9b-9a23-40a2046d9dc8"   # L1
          - "5ebf475a-d7ea-477a-995b-f5bb3f8ade26"   # L2
          - "3b90db67-7706-44b8-b13b-1215790f90dd"   # L3
        sessionExpiry: 240h

executor:
  image:
    registry: docker.io
    repository: bitnamilegacy/argo-workflow-exec
    tag: 3.7.1-debian-12-r1

postgresql:
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.5.0-debian-12-r20

# Plain (unencrypted) Secret holding the Entra client id/secret, hardcoded here
# instead of via kubeseal/sealed-secrets. Referenced by server.auth.sso.config above.
extraDeploy:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: argo-server-sso
    type: Opaque
    stringData:
      client-id: "e9bcbd83-4e58-4740-bf5a-02103b264f45"
      client-secret: "65-8Q~odDB9WOcAg5PrgOMst0H4sL8LE.jDRSb9K"
